<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>V-Green EV Charger Tender Tracker</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<header>
		<h1>EV Charging Tender Tracker</h1>
		<h2>PM E-DRIVE Opportunities</h2>
	</header>

	<div class="cards">
		<div class="card live">
			<h2 id="liveCount">0</h2>
			<p>Live</p>
		</div>
		<div class="card upcoming">
		<h2 id="upcomingCount">0</h2>
			<p>Upcoming</p>
		</div>
		<div class="card evaluation">
			<h2 id="evaluationCount">0</h2>
			<p>Under Evaluation</p>
		</div>
		<div class="card awarded">
			<h2 id="awardedCount">0</h2>
			<p>Awarded</p>
		</div>
	</div>

<div class="filters">

    <input
        type="text"
        id="searchBox"
        placeholder="Search state, authority or tender..."
    >

    <select id="stateFilter">
        <option value="">All States</option>
    </select>

    <select id="statusFilter">
        <option value="">All Statuses</option>
        <option value="Live">Live</option>
        <option value="Upcoming">Upcoming</option>
        <option value="Under Evaluation">Under Evaluation</option>
        <option value="Awarded">Awarded</option>
    </select>

    <select id="typeFilter">
        <option value="">All Tender Types</option>
    </select>

    <select id="sortFilter">
        <option value="default">Default Order</option>
        <option value="dateAsc">Bid Due Date: Earliest First</option>
        <option value="dateDesc">Bid Due Date: Latest First</option>
        <option value="stateAsc">State: A to Z</option>
        <option value="sitesDesc">Sites: Highest First</option>
        <option value="chargersDesc">Chargers: Highest First</option>
    </select>

    <button id="clearFilters" type="button">
        Clear Filters
    </button>

</div>

<p id="resultCount">Loading tenders...</p>

<div class="table-container">
<table id="tenderTable">
	<thead>
		<tr>
			<th>State</th>
			<th>Tender Authority</th>
			<th>Sites</th>
			<th>Chargers</th>
			<th>Tender Type</th>
			<th>Bid Due Date</th>
			<th>Status</th>
			<th>Supporting Documents</th>
		</tr>
	</thead>
<tbody></tbody>
</table>
</div>
<script src="script.js"></script>
</body>
</html>
